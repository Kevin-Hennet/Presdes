name: Verify PresDes
on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7

  release-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the Ubuntu release
        run: |
          bash -n deploy/build-release.sh
          bash -n deploy/activate-release.sh
          export PRESDES_RELEASES_DIR="$RUNNER_TEMP/presdes-releases"
          mkdir -p "$PRESDES_RELEASES_DIR"
          bash deploy/build-release.sh "$GITHUB_SHA"
      - name: Build the Render service
        run: bash render-build.sh

  deploy-render:
    needs: [backend, browser, release-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: presdes-render-production
      cancel-in-progress: false
    steps:
      - name: Deploy the tested master commit
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_URL repository secret."
            exit 1
          fi
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on master; skipping this deployment."
            exit 0
          fi
          curl --fail --silent --show-error --request POST --max-time 60 \
            --output "$RUNNER_TEMP/render-deploy.json" \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
          echo "Render accepted deployment of $GITHUB_SHA. Check Render for build and health status."
